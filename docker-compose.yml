services:
  # Speakr
  speakr:
    image: learnedmachine/speakr:0.8.20-alpha
    container_name: speakr
    restart: unless-stopped
    ports:
      - "80:8899"
    env_file:
      - speakr.env
    volumes:
      - "./data/speakr/autoprocess:/data/auto-process" # Dossier pour l'automatisation (optionel)
      - "./data/speakr/exports:/data/exports" # Dossier pour les exports (optionel)
      - "./data/speakr/uploads:/data/uploads" # Dossier des uploads -> Configurer la retention
      - "./data/speakr/instance:/data/instance" # Dossier de la BDD & cache
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python3 -c "
          import urllib.request, sys
          try:
            urllib.request.urlopen('http://localhost:8899/login', timeout=5)
            sys.exit(0)
          except Exception:
            sys.exit(1)
          "
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "60s"
    
    depends_on:
      whisperx-asr:
        condition: service_healthy   # Attendre le service ASR
        required: false              # Lancer quand même si il n'est pas prêt
  
  # WhisperX ASR Service
  whisperx-asr:
    image: learnedmachine/whisperx-asr-service:0.3.1
    container_name: whisperx-asr
    restart: unless-stopped
    # 
    # environment:
    #   - HF_HUB_OFFLINE=1
    env_file:
      - whisperx-asr.env
    volumes:
      - ./data/whisperx/cache:/.cache
    # Configuration du GPU (optionel si CPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:9000/health')"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "120s"
